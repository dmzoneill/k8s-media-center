apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      automountServiceAccountToken: false
      containers:
      - name: sonarr
        image: lscr.io/linuxserver/sonarr:latest
        resources:
          requests:
            memory: 256Mi
            ephemeral-storage: 500Mi
          limits:
            memory: 1Gi
            ephemeral-storage: 2Gi
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        volumeMounts:
        - name: sonarr-config
          mountPath: /config
        ports:
        - containerPort: 8989
      volumes:
      - name: sonarr-config
        persistentVolumeClaim:
          claimName: nfs-pvc

